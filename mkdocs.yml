# Andreas Avinyan - Fab School

site_name: Անդրեաս Ավինյան - Fab Lab
site_description: Անդրեաս Ավինյանի Fab Lab ուսումնական փաստաթղթավորման կայք
site_author: Andreas Avinyan
copyright: Copyright 2026 Andreas Avinyan - Creative Commons Attribution Non Commercial

site_url: https://andreasavinyan.github.io/my-website/

extra:
  social:
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/fabacademany
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/fabacademany
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/fabacademany
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/academany

theme:
  name: material
  language: hy

  palette:
    primary: deep
    accent: indigo

  font:
    text: Ubuntu
    code: Ubuntu Mono

  icon:
    logo: material/school

  favicon: images/favicon.svg

  features:
    - navigation.tabs
    - navigation.instant

plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: true
      enabled: !ENV [ENABLED_GIT_REVISION_DATE, False]

markdown_extensions:
  - extra
  - smarty
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true